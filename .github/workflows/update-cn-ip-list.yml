name: Update CN IP list

on:
  workflow_dispatch:      # allow manual runs from the Actions tab
  schedule:
    - cron: "0 3 * * *"   # run daily at 03:00 UTC (adjust as you like)

permissions:
  contents: write         # needed to push commits back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure dist directory exists
        run: mkdir -p dist

      - name: Make generator executable
        run: chmod +x ./generator.bash

      - name: Run generator
        run: ./generator.bash

      - name: Show generated file info
        run: |
          ls -lh dist
          echo "Preview:"
          head -n 20 dist/cn_ip_cidr.rsc || true

      - name: Commit and push changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # stage the generated file AND generator.bash (for the first run where chmod changed it)
            git add dist/cn_ip_cidr.rsc generator.bash
            git commit -m "Update CN IP list (auto)" || exit 0
            git push
          else
            echo "No changes to commit."
          fi

